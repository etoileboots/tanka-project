<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Hyakunin Isshu — Annotation Review</title>
<style>
  :root{
    --bg:#faf8f4; --panel:#ffffff; --ink:#1a1a1a; --sub:#6b6a66;
    --border:#e4e1da; --accent:#8a3b2f;
    --approved:#3f7d5c; --flagged:#b0432a; --pending:#b8930f;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Iowan Old Style','Georgia',serif;background:var(--bg);color:var(--ink);}
  #app{display:grid;grid-template-columns:260px 1fr;min-height:100vh;}
  #sidebar{border-right:1px solid var(--border);background:var(--panel);overflow-y:auto;padding:1rem 0;}
  #sidebar h1{font-size:.95rem;text-transform:uppercase;letter-spacing:.08em;color:var(--sub);padding:0 1rem;margin:0 0 .8rem;}
  .poem-item{display:flex;align-items:center;justify-content:space-between;padding:.5rem 1rem;cursor:pointer;font-size:.9rem;}
  .poem-item:hover{background:#f2efe8;}
  .poem-item.active{background:#f2e9e3;font-weight:600;}
  .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
  .dot.approved{background:var(--approved);}
  .dot.flagged{background:var(--flagged);}
  .dot.pending{background:var(--pending);}
  #main{padding:2rem 3rem;overflow-y:auto;}
  .poem-header{margin-bottom:1.5rem;}
  .poem-header h2{margin:0 0 .2rem;font-size:1.6rem;}
  .poem-header .poet{color:var(--sub);font-size:.95rem;}
  .jp-block{font-size:1.3rem;line-height:2;margin:1rem 0;color:#333;}
  .romaji{font-style:italic;color:var(--sub);margin-bottom:1.5rem;}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:6px;padding:1.2rem 1.4rem;margin-bottom:1.2rem;}
  .card h3{margin:0 0 .6rem;font-size:1.05rem;display:flex;align-items:center;justify-content:space-between;}
  .card .field{margin-bottom:.5rem;font-size:.9rem;}
  .card .field b{color:var(--sub);font-weight:600;margin-right:.3rem;}
  .review-controls{display:flex;align-items:center;gap:.5rem;}
  .review-controls button{border:1px solid var(--border);background:#fff;border-radius:4px;padding:.25rem .6rem;font-size:.78rem;cursor:pointer;font-family:inherit;}
  .review-controls button.active-approved{background:var(--approved);color:#fff;border-color:var(--approved);}
  .review-controls button.active-flagged{background:var(--flagged);color:#fff;border-color:var(--flagged);}
  textarea.notes{width:100%;font-family:inherit;font-size:.85rem;border:1px solid var(--border);border-radius:4px;padding:.4rem;margin-top:.5rem;min-height:2.4em;}
  .en-lines{white-space:pre-wrap;font-size:.95rem;line-height:1.7;margin:.5rem 0;padding:.6rem .8rem;background:#faf8f4;border-radius:4px;}
  .tag{display:inline-block;background:#f2e9e3;color:var(--accent);border-radius:3px;padding:0 .4rem;font-size:.75rem;margin-right:.3rem;}
  .empty{color:var(--sub);padding:2rem;text-align:center;}
</style>
</head>
<body>
<div id="app">
  <div id="sidebar">
    <h1>Poems</h1>
    <div id="poemList"></div>
  </div>
  <div id="main"><div class="empty">Select a poem</div></div>
</div>

<script>
let currentPoem = null;

function escHtml(value) {
  return String(value ?? '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;');
}

async function loadPoemList() {
  const res = await fetch('/api/poems');
  const poems = await res.json();
  const list = document.getElementById('poemList');
  list.innerHTML = '';
  poems.forEach(p => {
    const el = document.createElement('div');
    el.className = 'poem-item' + (currentPoem === p.poem_number ? ' active' : '');
    el.innerHTML = `<span>#${p.poem_number} — ${escHtml(p.poet)}</span><span class="dot ${p.overall}"></span>`;
    el.onclick = () => selectPoem(p.poem_number);
    list.appendChild(el);
  });
}

function statusButtons(target, poemNum, current) {
  const mk = (status, label) => {
    const activeClass = current === status ? `active-${status}` : '';
    return `<button class="${activeClass}" onclick="setStatus(${poemNum}, '${target}', '${status}')">${label}</button>`;
  };
  return `<div class="review-controls">${mk('approved','✓ Approve')}${mk('flagged','⚑ Flag')}${mk('pending','↺ Reset')}</div>`;
}

function renderDeviceList(items, fields) {
  if (!items || items.length === 0) return '<div class="field"><i>none identified</i></div>';
  return items.map(it => `<div class="field">${fields.map(f => `<b>${f}:</b> ${escHtml(JSON.stringify(it[f] ?? ''))}`).join(' ')}</div>`).join('');
}

async function selectPoem(n) {
  currentPoem = n;
  loadPoemList();
  const res = await fetch(`/api/poem/${n}`);
  if (!res.ok) {
    document.getElementById('main').innerHTML = '<div class="empty">Not yet annotated</div>';
    return;
  }
  const data = await res.json();
  render(data);
}

function render(data) {
  const src = data.source_analysis;
  const review = data.review;
  const main = document.getElementById('main');

  let html = `
    <div class="poem-header">
      <h2>#${data.poem_number}</h2>
      <div class="poet">${escHtml(data.poet)}</div>
    </div>
    <div class="jp-block">${data.source_jp.split('\\n').map(escHtml).join('<br>')}</div>
    <div class="romaji">${escHtml(data.romaji)}</div>

    <div class="card">
      <h3>Source Analysis ${statusButtons('source', data.poem_number, review.source.status)}</h3>
      <div class="field"><b>Bipartite:</b> ${escHtml(src.bipartite.relationship_type)} — kami ${escHtml(JSON.stringify(src.bipartite.kami_ku))} / shimo ${escHtml(JSON.stringify(src.bipartite.shimo_ku))}</div>
      <div class="field">${escHtml(src.bipartite.pivot_note)}</div>
      <div class="field"><b>Kigo:</b> ${escHtml(src.kigo?.word || 'none')} (${escHtml(src.kigo?.season || '—')})</div>
      <h3 style="font-size:.9rem;margin-top:1rem;">Makurakotoba</h3>
      ${renderDeviceList(src.makurakotoba, ['word','precedes'])}
      <h3 style="font-size:.9rem;margin-top:1rem;">Kakekotoba</h3>
      ${renderDeviceList(src.kakekotoba, ['word','reading_primary','reading_secondary'])}
      <textarea class="notes" placeholder="reviewer notes…" onchange="setNotes(${data.poem_number},'source',this.value)">${escHtml(review.source.notes)}</textarea>
    </div>
  `;

  ['Dickens','Noguchi','Porter','McCauley'].forEach(t => {
    const tr = data.translations[t];
    if (!tr) return;
    const rev = review.translations[t];
    html += `
      <div class="card">
        <h3>${t} ${statusButtons(t, data.poem_number, rev.status)}</h3>
        <div class="en-lines">${escHtml(data.translation_text[t])}</div>
        <div class="field"><b>Bipartite:</b> ${escHtml(tr.bipartite?.preserved || '—')}</div>
        <div class="field"><b>Fidelity:</b> ${escHtml(tr.overall_fidelity || '—')}</div>
        <div class="field"><i>${escHtml(tr.translator_strategy)}</i></div>
        <textarea class="notes" placeholder="reviewer notes…" onchange="setNotes(${data.poem_number},'${t}',this.value)">${escHtml(rev.notes)}</textarea>
      </div>
    `;
  });

  main.innerHTML = html;
}

async function setStatus(n, target, status) {
  const notesEl = [...document.querySelectorAll('textarea.notes')];
  await fetch(`/api/review/${n}`, {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({target, status, notes: ''})
  }).then(r => r.json()).then(() => selectPoem(n));
}

async function setNotes(n, target, notes) {
  const res = await fetch(`/api/poem/${n}`);
  const data = await res.json();
  const current = target === 'source' ? data.review.source : data.review.translations[target];
  await fetch(`/api/review/${n}`, {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({target, status: current.status, notes})
  });
}

loadPoemList();
</script>
</body>
</html>
